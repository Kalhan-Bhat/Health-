[project]
name = "medbridge-backend"
version = "1.0.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI uses function calls (File(...), Form(...)) in defaults by design

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: tests that call the real Groq API (run with: pytest -m live; needs GROQ_API_KEY)",
]
addopts = "-m 'not live'"

[tool.ruff.lint.per-file-ignores]
# schemas.py is kept exactly as written in spec §7.3 (uses Optional[...]).
"app/schemas.py" = ["UP007", "UP045"]
# Prompts are copied verbatim from spec §9, so long lines are kept as written.
"app/prompts/*.py" = ["E501"]
